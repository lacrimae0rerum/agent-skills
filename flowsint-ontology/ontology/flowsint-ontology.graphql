  CONTENT
  """Financial instruments and value transfer. Accounts, cards, wallets, transactions, and tokens."""
  FINANCIAL
  """
  Analytic assessments. Scores and profiles that evaluate another entity. They are judgements, not observations.
  """
  ASSESSMENT
  """Physical objects. Tangible items of investigative interest."""
  PHYSICAL
}

