enum SensitivityClass {
  """
  Record only when the input states it explicitly and the investigative purpose requires it. Never infer it. emit.py lists every such value in the Markdown report.
  """
  SPECIAL_CATEGORY
  """
  Record only when stated in the input and required by the purpose. Never guess a format or complete a partial number.
  """
  GOVERNMENT_ID
  """
  Record when stated and required. Keep the value exact because it is an identity field; the report masks it to the last 4 characters.
  """
  FINANCIAL
  """
  Never record plaintext. Passwords: keep only a hash the source provides; never hash a plaintext password yourself (weak passwords are reversible); otherwise omit it and list it in excluded. High-entropy tokens and keys: store sha256:<hex> or a masked form (****1234). Node ids for secret identity values are hashed. emit.py blocks values that look like plaintext secrets.
  """
  SECRET
}

