"""Any Flowsint node. Type properties follow on each implementing type."""
interface Entity {
  nodeId: ID!
  nodeType: EntityType!
  nodeLabel: String!
  nodeDomain: OntologyDomain!
  nodeConfidence: Float
  nodeEvidence: [Evidence!]!
  nodeRelationships(direction: Direction = BOTH, label: RelationshipLabel): [Relationship!]!
}

"""Represents an Autonomous System Number with associated network information."""
type ASN implements Entity @flowsint(key: "asn", domain: INFRASTRUCTURE, categories: ["network"], primaryField: "asn_str", labelKey: "number") @identity(mode: "all", fields: ["asn_str"], canonicalizers: ["asn_as_form"]) {
  nodeId: ID!
  nodeType: EntityType!
  nodeLabel: String!
  nodeDomain: OntologyDomain!
  nodeConfidence: Float
  nodeEvidence: [Evidence!]!
